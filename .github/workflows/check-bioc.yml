## Read more about GitHub actions the features of this GitHub Actions workflow
## at https://lcolladotor.github.io/biocthis/articles/biocthis.html#use_bioc_github_action
##
## For more details, check the biocthis developer notes vignette at
## https://lcolladotor.github.io/biocthis/articles/biocthis_dev_notes.html
##
## You can add this workflow to other packages using:
## > biocthis::use_bioc_github_action()
##
## Using GitHub Actions exposes you to many details about how R packages are
## compiled and installed in several operating system.s
### If you need help, please follow the steps listed at
## https://github.com/r-lib/actions#where-to-find-help
##
## If you found an issue specific to biocthis's GHA workflow, please report it
## with the information that will make it easier for others to help you.
## Thank you!

## Acronyms:
## * GHA: GitHub Action
## * OS: operating system

on:
  push:
  pull_request:

name: R-CMD-check-bioc

## These environment variables control whether to run GHA code later on that is
## specific to testthat, covr, and pkgdown.
##
## If you need to clear the cache of packages, update the number inside
## cache-version as discussed at https://github.com/r-lib/actions/issues/86.
## Note that you can always run a GHA test without the cache by using the word
## "/nocache" in the commit message.
env:
  has_testthat: 'true'
  run_covr: 'true'
  run_pkgdown: 'true'
  pkgdown_repo: 'sipss/AlpsNMR'
  uses_latex: true
  has_RUnit: 'false'
  cache-version: 'cache-v5'
  run_docker: 'false'

jobs:
  build-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    ## Environment variables unique to this job.

    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              os: ubuntu-24.04,
              conf_name: 'ubuntu',
              r: '4.6',
              bioc: '3.23',
              cont: "bioconductor/bioconductor_docker:RELEASE_3_23"
            }
          ## Check https://github.com/r-lib/actions/tree/master/examples
          ## for examples using the http-user-agent
    env:
      CONF_NAME: ${{ matrix.config.conf_name }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_VERSION: ${{ matrix.config.r }}
      BIOC_VERSION: ${{ matrix.config.bioc }}
      NOT_CRAN: true
      TZ: UTC
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:

      ## Set the R library to the directory matching the
      ## R packages cache step further below when running on Docker (Linux).
      - name: Set R Library home on Linux
        if: runner.os == 'Linux'
        run: |
          mkdir /__w/_temp/Library
          echo ".libPaths('/__w/_temp/Library')" > ~/.Rprofile

      - name: Setup Posit Public Package Manager
        if: runner.os == 'Linux'
        run: |
          echo 'options(BioC_mirror = "https://p3m.dev/bioconductor/__linux__/noble/latest")' >> ~/.Rprofile
          echo 'options(BIOCONDUCTOR_CONFIG_FILE = "https://p3m.dev/bioconductor/latest/config.yaml")' >> ~/.Rprofile
          echo 'Sys.setenv("R_BIOC_VERSION" = "3.23")' >> ~/.Rprofile
          echo 'options(repos = c(CRAN = "https://p3m.dev/cran/__linux__/noble/latest"))' >> ~/.Rprofile

      ## Most of these steps are the same as the ones in
      ## https://github.com/r-lib/actions/blob/master/examples/check-standard.yaml
      ## If they update their steps, we will also need to update ours.
      - name: Checkout Repository
        uses: actions/checkout@v6

      ## R is already included in the Bioconductor docker images
      - name: Setup R from r-lib
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      ## pandoc is already included in the Bioconductor docker images
      - name: Setup pandoc from r-lib
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-pandoc@v2

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
        shell: Rscript {0}

      - name: Restore R package cache
        if: "!contains(github.event.head_commit.message, '/nocache') && runner.os != 'Linux'"
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ env.cache-version }}-${{ runner.os }}-biocversion-RELEASE_${{ env.BIOC_VERSION }}-r-${{ env.R_VERSION }}-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ env.cache-version }}-${{ runner.os }}-biocversion-RELEASE_${{ env.BIOC_VERSION }}-r-${{ env.R_VERSION }}-

      - name: Cache R packages on Linux
        if: "!contains(github.event.head_commit.message, '/nocache') && runner.os == 'Linux' "
        uses: actions/cache@v6
        with:
          path: /__w/_temp/Library
          key: ${{ env.cache-version }}-${{ runner.os }}-biocversion-RELEASE_${{ env.BIOC_VERSION }}-r-${{ env.R_VERSION }}-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ env.cache-version }}-${{ runner.os }}-biocversion-RELEASE_${{ env.BIOC_VERSION }}-r-${{ env.R_VERSION }}-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sysreqs=$(Rscript -e 'cat("apt-get update -y && apt-get install -y", paste(gsub("apt-get install -y ", "", remotes::system_requirements("ubuntu", "22.04")), collapse = " "))')
          echo $sysreqs
          sudo -s eval "$sysreqs"
          sudo apt-get install -y texlive-extra-utils texlive-latex-extra texlive-latex-base texlive-latex-recommended lmodern texlive-luatex texlive-full

      - name: Install macOS system dependencies
        if: matrix.config.os == 'macOS-latest'
        run: |
          ## Enable installing XML from source if needed
          brew install libxml2
          echo "XML_CONFIG=/usr/local/opt/libxml2/bin/xml2-config" >> $GITHUB_ENV

          ## Required to install magick as noted at
          ## https://github.com/r-lib/usethis/commit/f1f1e0d10c1ebc75fd4c18fa7e2de4551fd9978f#diff-9bfee71065492f63457918efcd912cf2
          brew install imagemagick@6

          ## For textshaping, required by ragg, and required by pkgdown
          brew install harfbuzz fribidi

          ## For installing usethis's dependency gert
          brew install libgit2

          ## Required for tcltk
          brew install xquartz --cask

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        run: |
          ## Edit below if you have any Windows system dependencies
        shell: Rscript {0}

      - name: Diagnose Rfast/TBB (pristine image state)
        if: runner.os == 'Linux'
        run: |
          echo "DIAG_STAGE=pristine" > /tmp/diag_stage
          Rscript .github/diag-rfast-tbb.R || true

      - name: Install BiocManager
        run: |
          message(paste('****', Sys.time(), 'installing BiocManager ****'))
          remotes::install_cran("BiocManager")
        shell: Rscript {0}

      - name: Set BiocVersion
        run: |
          BiocManager::install(version = "${{ matrix.config.bioc }}", ask = FALSE, force = TRUE)
        shell: Rscript {0}


      - name: Install tinytex
        if:  env.uses_latex == 'true' && runner.os == 'Windows'
        run: |
          ## Install tinytex
          #print("Skipping, using texlive?")
          install.packages('tinytex')
          tinytex::install_tinytex()
          tinytex::tlmgr_install("pdfcrop")
        shell: Rscript {0}

      - name: Install dependencies
        run: |
          ## For running the checks
          message(paste('****', Sys.time(), 'installing rcmdcheck and BiocCheck ****'))
          BiocMqnager::install(c("rcmdcheck", "BiocCheck"))

          ## Pass #1 at installing dependencies
          ## This pass uses AnVIL-powered fast binaries
          ## details at https://github.com/nturaga/bioc2021-bioconductor-binaries
          ## The speed gains only apply to the docker builds.
          message(paste('****', Sys.time(), 'pass number 1 at installing dependencies: local dependencies ****'))
          remotes::install_local(dependencies = TRUE, build_vignettes = FALSE, upgrade = TRUE)
        shell: Rscript {0}

      - name: Diagnose Rfast/TBB (deps1 state)
        if: runner.os == 'Linux'
        run: |
          echo "DIAG_STAGE=deps1" > /tmp/diag_stage
          Rscript .github/diag-rfast-tbb.R || true

      - name: Install BiocStyle fork (pandoc and pkgdown compatibility fixes)
        run: |
          ## zeehio/BiocStyle@my-fixes carries two fixes not yet upstream:
          ##  - pandoc >=3.8.1: vignette builds fail ("LaTeX Error: No counter
          ##    'none' defined") because pandoc emits \LTcaptype{none} for
          ##    uncaptioned longtables, and BiocStyle's LaTeX template never
          ##    predefines that counter.
          ##    https://github.com/Bioconductor/BiocStyle/pull/116
          ##  - pkgdown: fixes BiocStyle/pkgdown interaction issues when
          ##    building the pkgdown site.
          ## Installed once, here, for every run (not just the pkgdown-deploying
          ## devel runs): later steps' dependency installs (e.g. "Install
          ## dependencies pass 2", which runs with upgrade = TRUE) leave an
          ## already-installed package alone once its version satisfies the
          ## requirement, so this doesn't need to be re-installed later.
          remotes::install_github("zeehio/BiocStyle@fix-pandoc-382-counter", force = TRUE)
        shell: Rscript {0}

      - name: Install BiocGenerics
        if:  env.has_RUnit == 'true'
        run: |
          ## Install BiocGenerics
          BiocManager::install("BiocGenerics")
        shell: Rscript {0}

      - name: Install covr
        if: github.ref == 'refs/heads/devel' && env.run_covr == 'true' && runner.os == 'Linux'
        run: |
          remotes::install_cran("covr")
        shell: Rscript {0}

      - name: Install pkgdown
        if: github.ref == 'refs/heads/devel' && env.run_pkgdown == 'true' && runner.os == 'Linux'
        run: |
          ## The pkgdown-compatibility fix for BiocStyle is already installed
          ## by the "Install BiocStyle fork" step above (zeehio/BiocStyle@my-fixes
          ## covers both the pandoc and pkgdown fixes now).
          remotes::install_cran("pkgdown")
        shell: Rscript {0}

      - name: Diagnose Rfast/TBB (post-install state)
        if: runner.os == 'Linux'
        run: |
          echo "DIAG_STAGE=post-install" > /tmp/diag_stage
          Rscript .github/diag-rfast-tbb.R || true

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Run CMD check
        env:
          _R_CHECK_CRAN_INCOMING_: false
          DISPLAY: 99.0
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
              args = c("--no-manual", "--no-vignettes", "--timings"),
              build_args = c("--no-manual", "--keep-empty-dirs", "--no-resave-data"),
              error_on = "warning",
              check_dir = "check"
          )
        shell: Rscript {0}

      ## Might need an to add this to the if:  && runner.os == 'Linux'
      - name: Reveal testthat details
        if:  env.has_testthat == 'true'
        run: find . -name testthat.Rout -exec cat '{}' ';'

      - name: Run RUnit tests
        if:  env.has_RUnit == 'true'
        run: |
          BiocGenerics:::testPackage()
        shell: Rscript {0}

      - name: Run BiocCheck
        env:
          DISPLAY: 99.0
        run: |
          BiocCheck::BiocCheck(
              dir('check', 'tar.gz$', full.names = TRUE),
              `quit-with-status` = TRUE,
              `no-check-R-ver` = TRUE,
              `no-check-bioc-help` = TRUE
          )
        shell: Rscript {0}

      - name: Test coverage
        if: github.ref == 'refs/heads/devel' && env.run_covr == 'true' && runner.os == 'Linux' && env.CONF_NAME == 'ubuntu'
        run: |
          covr::codecov()
        shell: Rscript {0}

      - name: Install package
        if: github.ref == 'refs/heads/devel' && env.run_pkgdown == 'true' && runner.os == 'Linux'
        run: R CMD INSTALL .

      - name: Build and deploy pkgdown site
        if: github.ref == 'refs/heads/devel' && env.run_pkgdown == 'true' && runner.os == 'Linux' && github.repository == env.pkgdown_repo  && env.CONF_NAME == 'ubuntu'
        run: |
          git config --global --add safe.directory /__w/AlpsNMR/AlpsNMR
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          Rscript -e "pkgdown::deploy_to_branch(new_process = FALSE)"
        shell: bash {0}
        ## Note that you need to run pkgdown::deploy_to_branch(new_process = FALSE)
        ## at least one locally before this will work. This creates the gh-pages
        ## branch (erasing anything you haven't version controlled!) and
        ## makes the git history recognizable by pkgdown.

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-biocversion-RELEASE_${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-results
          path: check

        ## Note that DOCKER_PASSWORD is really a token for your dockerhub
        ## account, not your actual dockerhub account password.
        ## This comes from
        ## https://seandavi.github.io/BuildABiocWorkshop/articles/HOWTO_BUILD_WORKSHOP.html#6-add-secrets-to-github-repo
        ## Check https://github.com/docker/build-push-action/tree/releases/v1
        ## for more details.
      - uses: docker/build-push-action@v7
        if: "!contains(github.event.head_commit.message, '/nodocker') && env.run_docker == 'true' && runner.os == 'Linux' && github.repository == env.pkgdown_repo "
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: 
          tag_with_ref: true
          tag_with_sha: true
          tags: latest
